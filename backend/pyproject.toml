[project]
name = "quantum-from-zero"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "python-dotenv>=1,<2",
  "qiskit>=2.1,<3", "qiskit-aer>=0.17,<0.18",
  "qiskit-ionq>=1.0,<2", "qiskit-optimization>=0.7,<0.8",
  "numpy>=2,<3", "scipy>=1.15,<2"
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
